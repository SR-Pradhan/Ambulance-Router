<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Emergency ambulance routing and hospital dispatch. Simulated data." />
    <!-- Inline SVG favicon: no extra file, and no 404 for /favicon.ico.
         Same artwork as components/Logo.jsx, kept in sync by hand. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%232dd4bf%22%2F%3E%3Cpath%20d%3D%22M4%2019.5h5l3-10%204%2014%203-8.5h3.4%22%20fill%3D%22none%22%20stroke%3D%22%230f1113%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2226.6%22%20cy%3D%2215%22%20r%3D%222.7%22%20fill%3D%22%230f1113%22%2F%3E%3C%2Fsvg%3E" />
    <title>Ambulance Route Optimizer</title>
  </head>
  <body>
    <!-- Runs before first paint so a dark theme user never sees a white flash
         while the bundle loads. Mirrors the logic in App.jsx. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.dataset.theme = saved;
          }
        } catch (e) {
          /* private mode or blocked storage: fall back to the OS setting */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
